<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miracle E-Catalogue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="brand-mark">MIRACLE</div>
    <h1>The Catalogue</h1>
    <p class="subtitle" id="headerSubtitle">Loading the catalogue...</p>

    <div class="controls">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="searchInput" placeholder="Search the catalogue...">
      </div>
      <select id="categoryFilter">
        <option value="">All categories</option>
      </select>
      <select id="subCategoryFilter">
        <option value="">All sub-categories</option>
      </select>
    </div>
  </header>

  <main>
    <p id="resultCount" class="result-count"></p>
    <div id="loadingMsg" class="loading">Loading products...</div>
    <div id="productGrid" class="product-grid"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
